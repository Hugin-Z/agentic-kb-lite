# path_map.yaml — v0.2 schema(AI 语义路由,非规则匹配表)
#
# 范式切换(对照 v0.1):
#   - v0.1:path_mappings 是"源前缀 → corpus 子目录"的规则匹配表,ingest.py 按规则机械路由
#   - v0.2:本文件退化为"PARA bucket 语义说明 + hint 关键词 + 偏好覆盖",
#           真实路由判断由 AI(Claude Code)在 agent loop 内基于 buckets/hint_subdir_keywords/CLAUDE.md 第 6 节做出
#
# 详见 docs/v0.2-plan.md §2.2 与 §4.3 步骤 1.2

version: 2

# PARA bucket 语义说明(供 AI 路由参考)
buckets:
  01-projects:
    semantics: "有明确客户/合同/交付物的具体工作单元,即使没有客户名和时间。识别要点:目录下有总体方案/架构设计/纪要/调研等'交付物'迹象"
    examples: ["智慧城市可视化平台", "某客户XX系统", "数字住建二期"]

  02-areas:
    semantics: "长期维护的责任领域,不属于单个项目。识别要点:跨项目复用的方法论、产品资料、章节模板"
    examples: ["产品方案库", "投标章节模板", "技术方法论", "handbook"]
    subdirs: ["产品方案库", "行业解决方案", "投标章节模板", "技术方法论"]

  03-resources:
    semantics: "参考资料,只参考不维护。识别要点:外部权威发布的国标行标、行业研究、竞品资料、培训资料"
    examples: ["国标行标", "行业研究", "竞品资料", "培训与调研"]
    subdirs: ["国标行标", "行业研究", "竞品资料", "培训与调研"]

  04-archives:
    semantics: "已交付且后续不会再用的老项目。识别要点:目录名含'已交付/已归档/已完成'等明示;或 6 个月以上无新文件活跃"

# 特殊子目录脱钩规则(AI 路由的辅助提示,非硬规则)
hint_subdir_keywords:
  resources_hint:
    - 标准
    - 规范
    - 国标
    - 行标
    - 竞品
    - 友商
    - 培训
    - 行业研究
    - 调研报告
  areas_hint:
    - 产品方案
    - 产品资料
    - 投标章节
    - 模板
    - 方法论
    - handbook
  archives_hint:
    - 已交付
    - 已完成
    - 已归档

# 项目内部 5 子目录约定
project_subdirs:
  "01-方案": "总体方案、设计文档、架构图等核心交付物"
  "02-章节": "可独立复用的章节素材"
  "03-纪要": "会议纪要、客户沟通"
  "04-调研": "需求调研、客户访谈"
  "05-附图": "架构图、流程图、截图等图片"
  "99-其他": "兜底,AI 判断不出归属的"

# 用户偏好覆盖(可选,优先级高于 AI 判断)
# 默认空列表;有需要时取消注释下方示例并按需修改
explicit_mappings: []
# 示例(取消注释后生效):
# - source: "D:/某客户合同包/"
#   target: "02-areas/合同档案/"
#   reason: "目录虽含项目名,但内容是合同文档,归 areas 更合适"
